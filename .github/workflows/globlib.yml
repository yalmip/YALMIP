name: Globlib regression test

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  globlib:
    name: Globlib (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [qp, qcqp, polynomial, general]
    uses: ./.github/workflows/matlab-tests.yml
    with:
      group: globlib-${{ matrix.suite }}
      folders: dev/tests/globlib/${{ matrix.suite }}
