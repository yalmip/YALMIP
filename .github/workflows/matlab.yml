name: Complete integration test

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Integration (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: basics
            folders: dev/tests/core; dev/tests/operators; dev/tests/misc
          - group: modules
            folders: dev/tests/optimizer; dev/tests/robust; dev/tests/dualize; dev/tests/geometric; dev/tests/sos; dev/tests/moment
          - group: solvers
            folders: dev/tests/bnb; dev/tests/bmibnb; dev/tests/bilevel; dev/tests/cutsdp; dev/tests/slayer
    uses: ./.github/workflows/matlab-tests.yml
    with:
      group: integration-${{ matrix.group }}
      folders: ${{ matrix.folders }}
